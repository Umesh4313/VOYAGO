server.port=${PORT:8001}

spring.application.name=voyago-backend

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:voyago}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.seed-development-accounts=${SEED_DEVELOPMENT_ACCOUNTS:false}

logging.level.com.voyago=INFO
logging.level.org.springframework.security=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null