# ===========================
# VOYAGO Backend Configuration
# ===========================

# Server
server.port=${PORT:8001}
spring.application.name=voyago-backend

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:voyago}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Development-only accounts. Keep disabled in client/production deployments.
app.seed-development-accounts=false

# Logging
logging.level.com.voyago=INFO
logging.level.org.springframework.security=INFO

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
